name: Android baseline debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-baseline-debug-apk:
    name: Build PR29 baseline debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK from PR29 baseline
        run: flutter build apk --debug

      - name: Verify and hash APK
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee apk-sha256.txt

      - name: Stage baseline artifact
        run: |
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-debug.apk artifact/fala-comigo-pr29-debug.apk
          cp apk-sha256.txt artifact/apk-sha256.txt
          test -s artifact/fala-comigo-pr29-debug.apk

      - name: Publish baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: fala-comigo-pr29-baseline-debug-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifact/fala-comigo-pr29-debug.apk
            artifact/apk-sha256.txt
